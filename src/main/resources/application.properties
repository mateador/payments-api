# ── Server ────────────────────────────────────────────────
server.port=8080

# ── Oracle datasource ─────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREE
spring.datasource.username=system
spring.datasource.password=YourPassword123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Tomcat — max concurrent HTTP connections
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=200

# ── Connection pool (HikariCP) ────────────────────────────
# HikariCP — must have enough DB connections to feed the thread pool
# Rule of thumb: paymentExecutor.maxPoolSize + buffer
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2
#spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JDBC ──────────────────────────────────────────────────
spring.jdbc.template.query-timeout=30

# ── Logging ───────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.example.paymentsapi=DEBUG
logging.level.org.springframework.jdbc=DEBUG